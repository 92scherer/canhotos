<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVEXA - Gestão de Canhotos de Entregas</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal backdrop Blur */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>
<body class="antialiased selection:bg-orange-500 selection:text-white flex flex-col justify-between min-h-screen">

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-4xl mx-auto px-4 py-6 flex-grow flex flex-col">

        <!-- CABEÇALHO COM LOGO MAIOR NO CANTO DIREITO -->
        <header class="mb-8 pb-6 border-b border-zinc-800 flex flex-row items-center justify-between gap-4">
            <!-- Título e Subtítulo à Esquerda -->
            <div class="flex-1">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-3 h-3 rounded-full bg-orange-500 animate-pulse"></span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white uppercase">
                        Gestão de <span class="text-orange-500">Canhotos</span>
                    </h1>
                </div>
                <p class="text-zinc-400 text-xs sm:text-sm mt-1 font-medium">
                    Sistema de Registro e Consulta de Entregas
                </p>
            </div>

            <!-- Logo Movexa no Canto Direito (Aumentado) -->
            <div class="flex-shrink-0 flex items-center justify-end">
                <img src="logo.jpeg" alt="Movexa Logo" 
                     onerror="this.onerror=null; this.classList.add('hidden'); document.getElementById('logoFallback').classList.remove('hidden');" 
                     class="h-16 sm:h-24 md:h-28 max-w-[200px] sm:max-w-[260px] object-contain rounded-lg shadow-md border border-zinc-800/60 bg-zinc-900/50 p-1">
                
                <!-- Fallback caso a imagem logo.jpeg ainda não esteja no servidor -->
                <div id="logoFallback" class="hidden flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-4 py-3 rounded-xl shadow-inner">
                    <i class="fa-solid fa-truck-fast text-orange-500 text-2xl"></i>
                    <span class="font-black text-xl tracking-wider text-white">MOVEXA</span>
                </div>
            </div>
        </header>

        <!-- AVISO TOAST / ALERTA DE NOTIFICAÇÃO -->
        <div id="toast" class="hidden mb-6 p-4 rounded-xl border text-sm font-semibold flex items-center justify-between transition-all duration-300 shadow-xl">
            <div class="flex items-center gap-3">
                <i id="toastIcon" class="fa-solid text-lg"></i>
                <span id="toastMessage"></span>
            </div>
            <button onclick="hideToast()" class="text-zinc-400 hover:text-white ml-4">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- ==================== TELA 1: HOME / INICIAL ==================== -->
        <section id="screenHome" class="fade-in flex-grow flex flex-col justify-center py-4">
            <div class="text-center mb-8">
                <h2 class="text-xl sm:text-2xl font-bold text-white">O que você deseja fazer hoje?</h2>
                <p class="text-zinc-400 text-sm mt-1">Selecione uma opção abaixo para prosseguir</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
                <!-- Botão 1: Adicionar Canhoto -->
                <button onclick="navigateTo('screenAdd')" class="group relative bg-zinc-900 hover:bg-zinc-800/90 border border-zinc-800 hover:border-orange-500/80 p-8 rounded-2xl shadow-lg transition-all duration-300 text-left flex flex-col justify-between items-start hover:-translate-y-1">
                    <div class="w-14 h-14 rounded-2xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-orange-500 text-2xl mb-6 group-hover:scale-110 group-hover:bg-orange-500 group-hover:text-white transition-all">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-white group-hover:text-orange-400 transition-colors">Adicionar Canhoto</h3>
                        <p class="text-zinc-400 text-xs mt-2 leading-relaxed">Cadastre uma nova entrega informando a data, a placa e tirando foto do comprovante.</p>
                    </div>
                    <div class="mt-6 flex items-center gap-2 text-xs font-bold text-orange-500 uppercase tracking-wider">
                        <span>Acessar</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>

                <!-- Botão 2: Buscar Canhoto -->
                <button onclick="navigateTo('screenSearch')" class="group relative bg-zinc-900 hover:bg-zinc-800/90 border border-zinc-800 hover:border-orange-500/80 p-8 rounded-2xl shadow-lg transition-all duration-300 text-left flex flex-col justify-between items-start hover:-translate-y-1">
                    <div class="w-14 h-14 rounded-2xl bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-300 text-2xl mb-6 group-hover:scale-110 group-hover:bg-orange-500 group-hover:text-white transition-all">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-white group-hover:text-orange-400 transition-colors">Buscar Canhoto</h3>
                        <p class="text-zinc-400 text-xs mt-2 leading-relaxed">Consulte canhotos salvos por placa do veículo e data de entrega.</p>
                    </div>
                    <div class="mt-6 flex items-center gap-2 text-xs font-bold text-orange-500 uppercase tracking-wider">
                        <span>Consultar</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- ==================== TELA 2: ADICIONAR CANHOTO ==================== -->
        <section id="screenAdd" class="hidden fade-in max-w-xl mx-auto w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-orange-500">
                        <i class="fa-solid fa-camera text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">Adicionar Canhoto</h2>
                        <p class="text-zinc-400 text-xs">Preencha os dados abaixo e envie a foto</p>
                    </div>
                </div>
                <button onclick="navigateTo('screenHome')" class="text-zinc-400 hover:text-white bg-zinc-800/80 hover:bg-zinc-800 p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
            </div>

            <form id="addReceiptForm" onsubmit="handleSaveReceipt(event)" class="space-y-5">
                <!-- Data da Entrega -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                        Data da Entrega <span class
